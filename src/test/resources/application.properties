spring.datasource.url=jdbc:h2:mem:familyapp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# The migrated schema is exercised as-is: no embedded database is substituted,
# so every test context runs the Flyway migrations on the H2 database above.
spring.test.database.replace=none
# Tests only accept a schema built by the migrations, never a baseline.
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.photos.storage-dir=./target/test-photos
