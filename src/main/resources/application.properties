spring.application.name=demo

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/familyapp}
spring.datasource.username=${DB_USERNAME:familyapp}
spring.datasource.password=${DB_PASSWORD:familyapp}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Versioned schema migrations. V1 is the baseline for databases that already
# existed before Flyway was adopted; later migrations apply on top of it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Object storage for DNI photos
app.photos.storage-dir=${PHOTOS_DIR:./data/photos}

# Uploads: DNI photos are capped at 10 MB each (30 MB per request)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Origins allowed to call the API from the (future) front-end
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
