name: Format

# The local git hooks are per-clone configuration (`make setup`) and
# `git commit --no-verify` skips them. This job is the backstop: it runs the
# same gate as `pre-push`, in check mode, and never rewrites files (ADR-0009).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: make format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm --prefix apps/frontend ci
      - run: make format-check
